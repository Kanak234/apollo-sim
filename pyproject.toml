[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "apollo-sim"
version = "0.1.0"
description = "High-precision orbital mechanics, Saturn V ascent, lunar transfer, landing, and rendezvous simulation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
testpaths = ["apollo_sim/tests"]
pythonpath = ["apollo_sim"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    "__pycache__",
    "lunar_lander",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
