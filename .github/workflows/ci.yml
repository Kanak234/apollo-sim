name: CI

on:
  push:
    branches: [master, main, prod-hardening]
  pull_request:
    branches: [master, main, prod-hardening]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} Test & Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip build setuptools>=61.0
          pip install ruff pytest pytest-cov numpy

      - name: Lint with ruff
        run: ruff check .

      - name: Compile check
        run: python -m compileall -q apollo_sim

      - name: Run test suite with coverage gate
        run: pytest

      - name: Verify wheel packaging
        run: python -m build --wheel

  docker:
    name: Container Build & Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: apollo-sim:smoke

      - name: Run Container Smoke Tests
        run: |
          docker run --rm apollo-sim:smoke --version
          docker run --rm apollo-sim:smoke --mission apollo11
